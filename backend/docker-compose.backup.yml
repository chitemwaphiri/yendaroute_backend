services:
  db:
    image: postgis/postgis:15-3.4
    container_name: yendaroute_central_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: yendaroute_user
      POSTGRES_PASSWORD: infosystems265
      POSTGRES_DB: yendaroute
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - yenda-network

  backend:
    build: .
    container_name: yendaroute_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=yendaroute_user
      - DB_PASS=infosystems265
      - DB_NAME=yendaroute
      - JWT_SECRET=super_secret_key
      - JWT_EXPIRES_IN=1d
    depends_on:
      - db
    networks:
      - yenda-network

volumes:
  pgdata:

networks:
  yenda-network:
    driver: bridge