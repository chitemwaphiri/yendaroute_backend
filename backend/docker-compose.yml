version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: yendaroute_central_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: yendaroute_user
      POSTGRES_PASSWORD: infosystems265
      POSTGRES_DB: yendaroute
    ports:
      - "5433:5432" 
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: