services:
  backend:
    build: .
    container_name: yendaroute_backend
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      DB_HOST: yendaroute_central_db
      DB_PORT: 5432
      DB_USER: yenda_app
      DB_PASS: ${DB_PASS}
      DB_NAME: yendaroute
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1d
    networks:
      - yenda-network

networks:
  yenda-network:
    external: true
    name: group-ff1_yenda-network
